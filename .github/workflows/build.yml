name: Build H29K QWRT

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  TARGET: rockchip_armv8

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Kwrt
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch 25.12 \
            https://github.com/kiddin9/Kwrt.git \
            kwrt

      - name: Install build dependencies
        run: |
          set -e

          sudo -E apt-get -qq update

          sudo -E apt-get -qq install \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            dwarves \
            llvm \
            python3-pyelftools \
            libpython3-dev \
            aria2 \
            jq \
            qemu-utils \
            ccache \
            rename \
            libelf-dev \
            device-tree-compiler \
            libgmp3-dev \
            libmpc-dev \
            libfuse-dev

          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git config --global user.name \
            "github-actions[bot]"

      - name: Clone OpenWrt
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch openwrt-25.12 \
            https://github.com/openwrt/openwrt.git \
            openwrt

          echo "===== OpenWrt revision ====="

          cd openwrt
          git log -1 --oneline
          cd ..

          test -f openwrt/Makefile
          test -f openwrt/include/toplevel.mk
          test -d openwrt/target/linux

          echo "OpenWrt source OK"

      - name: Load Kwrt files
        run: |
          set -e

          mkdir -p openwrt

          cp -rf kwrt/devices/common/. \
            openwrt/

          cp -rf kwrt/devices/${TARGET}/. \
            openwrt/

          cp -rf kwrt/devices \
            openwrt/

      - name: Add AIC8800 SDIO driver
        run: |
          set -e

          git clone \
            --filter=blob:none \
            --no-checkout \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

          cd immortalwrt
          git sparse-checkout init --cone
          git sparse-checkout set package/kernel/aic8800
          git checkout da63f7d6ac4207e534c9b92ba3d2b555a8edce8d
          cd ..

          rm -rf openwrt/package/kernel/aic8800
          cp -a \
            immortalwrt/package/kernel/aic8800 \
            openwrt/package/kernel/aic8800

          test -f openwrt/package/kernel/aic8800/Makefile

      - name: Add QModem
        run: |
          set -e

          git clone \
            --filter=blob:none \
            --no-checkout \
            https://github.com/FUjr/QModem.git \
            qmodem

          cd qmodem
          git checkout c49654efc870f53712ee8e25bf181722eb1466d9
          cd ..

          rm -rf openwrt/package/qmodem
          cp -a qmodem openwrt/package/qmodem

          test -f openwrt/package/qmodem/application/qmodem/Makefile
          test -f openwrt/package/qmodem/luci/luci-app-qmodem-next/Makefile

      - name: Prepare Kwrt build
        working-directory: openwrt
        run: |
          set -e

          function git_clone_path() {
            trap 'rm -rf "$tmpdir"' EXIT

            branch="$1"
            rurl="$2"
            mv="$3"

            [[ "$mv" != "mv" ]] && shift 2 || shift 3

            rootdir="$PWD"
            tmpdir="$(mktemp -d)"

            if [ ${#branch} -lt 10 ]; then
              git clone \
                -b "$branch" \
                --depth 1 \
                --filter=blob:none \
                --sparse \
                "$rurl" \
                "$tmpdir"

              cd "$tmpdir"
            else
              git clone \
                --filter=blob:none \
                --sparse \
                "$rurl" \
                "$tmpdir"

              cd "$tmpdir"
              git checkout "$branch"
            fi

            git sparse-checkout init --cone
            git sparse-checkout set "$@"

            if [[ "$mv" != "mv" ]]; then
              cp -rn ./* "$rootdir/"
            else
              mkdir -p "$rootdir/$@"
              mv -n "$@/"* "$rootdir/$@/"
            fi

            cd "$rootdir"
          }

          export -f git_clone_path
          export REPO_TOKEN=""

          chmod +x devices/common/diy.sh
          chmod +x devices/rockchip_armv8/diy.sh

          echo "===== Run common diy.sh ====="

          /bin/bash devices/common/diy.sh

          echo "===== Load Rockchip config ====="

          cp -f \
            devices/rockchip_armv8/.config \
            .config

          echo "===== Run Rockchip diy.sh ====="

          /bin/bash devices/rockchip_armv8/diy.sh

          cp -Rf ./diy/* ./ || true

          echo "===== Check Rockchip source ====="

          test -f target/linux/rockchip/Makefile
          test -f target/linux/rockchip/image/armv8.mk

          echo "Rockchip source OK"

      - name: Select H29K
        working-directory: openwrt
        run: |
          set -e

          sed -i \
            '/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_/d' \
            .config

          cat ../config/h29k.config >> .config

          echo "===== H29K configuration ====="

          grep -E \
            'CONFIG_TARGET_rockchip|CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_|CONFIG_PACKAGE_ttyd|CONFIG_PACKAGE_luci-app-ttyd' \
            .config || true

      - name: Add custom files
        working-directory: openwrt
        run: |
          set -e

          if [ -d ../files ]; then
            cp -a ../files/. .
          fi

      - name: Apply Kwrt patches
        working-directory: openwrt
        run: |
          set -e

          cp -rn \
            devices/common/patches \
            devices/rockchip_armv8/ 2>/dev/null || true

          if [ -d devices/rockchip_armv8/patches ]; then

            find \
              devices/rockchip_armv8/patches \
              -maxdepth 1 \
              -type f \
              -name '*.bin.patch' \
              -print0 |
            xargs -0 -r -n 1 git apply

            find \
              devices/rockchip_armv8/patches \
              -maxdepth 1 \
              -type f \
              -name '*.revert.patch' \
              -print0 |
            sort -z |
            xargs -0 -r -n 1 \
              sh -c \
              'patch -d ./ \
              -R \
              --no-backup-if-mismatch \
              -p1 \
              -F 1 \
              -i "$1"' _

            find \
              devices/rockchip_armv8/patches \
              -maxdepth 1 \
              -type f \
              -name '*.patch' \
              ! -name '*.revert.patch' \
              ! -name '*.bin.patch' \
              -print0 |
            sort -z |
            xargs -0 -r -n 1 \
              sh -c \
              'patch -d ./ \
              --no-backup-if-mismatch \
              -p1 \
              -F 1 \
              -i "$1"' _
          fi

      - name: Defconfig
        working-directory: openwrt
        run: |
          set -e

          make defconfig

          echo "===== TARGET AFTER DEFCONFIG ====="

          grep -E \
            'CONFIG_TARGET_rockchip|CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_' \
            .config || true

      - name: Force H29K target
        working-directory: openwrt
        run: |
          set -e

          sed -i \
            '/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_/d' \
            .config

          cat >> .config <<'EOF'

          CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h29k=y
          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          EOF

          echo "===== FINAL H29K TARGET ====="

          grep -E \
            'CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_|CONFIG_PACKAGE_ttyd|CONFIG_PACKAGE_luci-app-ttyd' \
            .config || true

      - name: Verify H29K target
        working-directory: openwrt
        run: |
          set -e

          grep -q \
            '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h29k=y$' \
            .config

          if grep -q \
            '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_advantech_rsb4810=y$' \
            .config; then
            echo "ERROR: Advantech target is still selected"
            exit 1
          fi

          for symbol in \
            CONFIG_PACKAGE_kmod-aic8800-sdio \
            CONFIG_PACKAGE_aic8800-sdio-firmware \
            CONFIG_PACKAGE_kmod-usb-acm \
            CONFIG_PACKAGE_kmod-usb-net-cdc-ncm \
            CONFIG_PACKAGE_kmod-usb-net-cdc-mbim \
            CONFIG_PACKAGE_kmod-usb-net-qmi-wwan \
            CONFIG_PACKAGE_luci-app-qmodem-next; do
            grep -q "^${symbol}=y$" .config || {
              echo "ERROR: required option ${symbol} is not enabled"
              exit 1
            }
          done

          echo "H29K target and required drivers selected successfully"

      - name: Remove incompatible GPIO patch for H29K
        working-directory: openwrt
        run: |
          set -e

          PATCH="target/linux/rockchip/patches-6.12/016-v6.13-gpio-rockchip-support-new-version-GPIO.patch"

          if [ -f "$PATCH" ]; then
            echo "Removing incompatible GPIO patch:"
            echo "$PATCH"
            rm -f "$PATCH"
          else
            echo "GPIO patch not found, continue"
          fi

      - name: Remove unused Rockchip DRM package
        working-directory: openwrt
        run: |
          set -e

          FILE="target/linux/rockchip/modules.mk"

          echo "===== Remove unused Rockchip DRM package ====="

          if grep -q '^define KernelPackage/drm-rockchip$' "$FILE"; then
            sed -i \
              '/^define KernelPackage\/drm-rockchip$/,/^\$(eval \$(call KernelPackage,drm-rockchip))$/d' \
              "$FILE"
          fi

          echo "===== Verify DRM package removal ====="

          if grep -q 'KernelPackage/drm-rockchip' "$FILE"; then
            echo "ERROR: drm-rockchip package still exists"
            exit 1
          fi

          echo "Rockchip DRM package successfully removed"

      - name: Download
        working-directory: openwrt
        run: |
          set -e

          make download -j8

      - name: Compile
        working-directory: openwrt
        run: |
          set -e

          echo "===== Prepare Linux kernel ====="

          make target/linux/prepare V=s

          KERNEL="$(find build_dir -path '*/drivers/thermal/rockchip_thermal.c' -print -quit)"

          echo "===== Fix Rockchip thermal warning ====="

          if [ -n "$KERNEL" ] && [ -f "$KERNEL" ]; then
            sed -i \
              's/^static int rk_tsadcv3_get_trim_code(/static __maybe_unused int rk_tsadcv3_get_trim_code(/' \
              "$KERNEL"
          else
            echo "ERROR: kernel thermal source not found"
            exit 1
          fi

          echo "===== Verify thermal fix ====="

          grep -n \
            "rk_tsadcv3_get_trim_code" \
            "$KERNEL"

          echo "===== Fix APK package version ====="

          find feeds package \
            -path '*/base-files/Makefile' \
            -type f \
            -print

          find feeds package \
            -path '*/base-files/Makefile' \
            -type f \
            -exec sed -i \
              -e 's/PKG_RELEASE:=.*$/PKG_RELEASE:=1/' \
              -e 's|^[[:space:]]*VERSION:=.*$|VERSION:=1|' \
              {} \;

          echo "===== Verify APK package version ====="

          grep -nE \
            '^(PKG_RELEASE|VERSION):=' \
            feeds/base/base-files/Makefile \
            package/base-files/Makefile 2>/dev/null || true

          echo "===== Start H29K compile ====="

          make -j$(($(nproc)+1))

      - name: Debug package install
        if: failure()
        working-directory: openwrt
        run: |
          set -e

          echo "===== DEBUG PACKAGE INSTALL ====="

          make package/install V=sc -j1

      - name: Validate firmware artifacts
        if: success()
        run: |
          set -e

          echo "===== BUILD RESULT ====="
          find openwrt/bin/targets -type f -print

          H29K_IMAGE="$(find openwrt/bin/targets -type f -iname '*h29k*.img.gz' -print -quit)"
          test -n "$H29K_IMAGE"

          echo "===== H29K IMAGE ====="
          echo "$H29K_IMAGE"

          if find openwrt/bin/targets -name profiles.json -print -quit | grep -q .; then
            PROFILE="$(find openwrt/bin/targets -name profiles.json -print -quit)"
            jq -e '.profiles | to_entries[] | select(.value.supported_devices[]? == "hinlink,opc-h29k" or .value.supported_devices[]? == "hinlink,h29k")' "$PROFILE"
          fi

          find openwrt/bin/targets -type f -exec sha256sum {} + \
            > openwrt/bin/targets/H29K-QWRT-SHA256SUMS

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: H29K-QWRT
          path: openwrt/bin/targets/
          if-no-files-found: error
